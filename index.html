    <!-- interactive-widget=resizes-content: without it, Chrome/Android
         leaves fixed-position elements sized against the pre-keyboard
         viewport when the on-screen keyboard opens, so it just overlays on
         top and covers them (e.g. the MY AI chat's mic/send buttons)
         instead of the layout shrinking to stay above it.
         viewport-fit=cover: required for env(safe-area-inset-*) to return
         real values instead of 0 — used to keep content clear of a phone's
         gesture-nav bar (see .holo-ai-input-row). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />

  <script>
    // Decode the path redirect from 404.html back into a real URL
    (function () {
      var p = window.location.search.match(/[?&]p=([^&]*)/);
      if (p) {
        var path = '/' + decodeURIComponent(p[1].replace(/~and~/g, '&'));
        var q = window.location.search.match(/[?&]q=([^&]*)/);
        var query = q ? '?' + decodeURIComponent(q[1].replace(/~and~/g, '&')) : '';
        window.history.replaceState(null, null, path + query + window.location.hash);
      }
    })();
  </script>
  <script>
    // Set the theme attribute before first paint so there's no light->dark flash.
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
