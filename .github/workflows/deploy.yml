name: Deploy site

# Rebuilds jmerkusheva.com whenever main changes: a merged pull request, or a
# journal entry published from the organizer (it commits
# public/blog/posts.json to main, see src/organizer/lib/publish.js).

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

# Publishing several entries in a row starts several runs; only the newest
# waiting one needs to go out, and a deploy already pushing is never cut off.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the build to gh-pages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # gh-pages clones the repo again into its own cache, where checkout's
      # credentials don't reach, so it gets the token in the remote URL.
      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx gh-pages -d dist \
            -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
