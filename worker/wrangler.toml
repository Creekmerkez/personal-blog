name = "julia-ai-worker"
main = "index.js"
compatibility_date = "2024-01-01"

# Rate limiting (recommended, optional — the Worker fails OPEN without it,
# so it still runs fine pre-setup, just without abuse protection).
#
# One-time setup:
#   1. wrangler kv namespace create RATE_LIMIT_KV
#   2. Copy the printed `id = "..."` into the [[kv_namespaces]] block below
#   3. wrangler deploy
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "PASTE_THE_ID_FROM_STEP_1_HERE"
